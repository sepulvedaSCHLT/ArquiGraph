name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  # ---------------------------------------------------------------------
  # Fase 2: el guardian vigilando los PRs del propio ArquiGraph.
  # Es la mejor demostracion del proyecto. Se activa cuando exista
  # `arqui check` (ver docs/ARCHITECTURE.md seccion 6).
